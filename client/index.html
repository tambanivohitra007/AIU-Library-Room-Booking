<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#17365f', // Brand primary (dark blue)
              'primary-light': '#1e4577',
              'primary-dark': '#0f2440',
              secondary: '#64748B',
              accent: '#0EA5E9',
              'accent-light': '#38bdf8',
              success: '#10B981',
              warning: '#F59E0B',
              danger: '#EF4444',
            },
            // Flat design: reduced corner rounding across the board
            borderRadius: {
              none: '0',
              sm: '1px',
              DEFAULT: '2px',
              md: '3px',
              lg: '4px',
              xl: '6px',
              '2xl': '8px',
              '3xl': '10px',
              full: '9999px',
            },
            // Flat design: no gradients, no glows — hairline borders do the separation
            boxShadow: {
              'soft': 'none',
              'medium': 'none',
              'strong': 'none',
              'glow': 'none',
              'glow-accent': 'none',
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

      * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Custom animations */
      @keyframes toast-enter {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @keyframes toast-exit {
        from {
          transform: translateX(0);
          opacity: 1;
        }
        to {
          transform: translateX(400px);
          opacity: 0;
        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes scale-in {
        from {
          transform: scale(0.95);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes slide-up {
        from {
          transform: translateY(20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes slide-down {
        from {
          transform: translateY(-20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* Flat backgrounds */
      .glass {
        background: #ffffff;
        border: 1px solid #e2e8f0;
      }

      .glass-dark {
        background: #17365f;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Flat headings (class name kept for compatibility) */
      .gradient-text {
        color: #17365f;
      }

      /* Smooth transitions */
      .transition-all-smooth {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Custom animations */
      .animate-toast-enter {
        animation: toast-enter 0.3s ease-out;
      }
      .animate-toast-exit {
        animation: toast-exit 0.3s ease-in;
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out;
      }
      .animate-scale-in {
        animation: scale-in 0.3s ease-out;
      }
      .animate-slide-up {
        animation: slide-up 0.4s ease-out;
      }
      .animate-slide-down {
        animation: slide-down 0.4s ease-out;
      }

      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      /* Flat design: no lift effect (class name kept for compatibility) */
      .hover-lift {
        transition: opacity 0.2s ease;
      }

      /* Focus rings */
      .focus-ring:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(23, 54, 95, 0.1);
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
